name: Release to Packagist

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Bump version to')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_WORKFLOW }}

      - name: Get current version
        id: current_version
        run: echo "version=$(jq -r .version composer.json)" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump_version
        run: |
          VERSION=${{ steps.current_version.outputs.version }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update composer.json version
        run: |
          jq '.version = "${{ steps.bump_version.outputs.new_version }}"' \
            composer.json > tmp.json && mv tmp.json composer.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add composer.json
          git commit -m "Bump version to ${{ steps.bump_version.outputs.new_version }}"
          git push origin master

      - name: Create and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_WORKFLOW }}
        run: |
          gh release create "v${{ steps.bump_version.outputs.new_version }}" \
            --title "v${{ steps.bump_version.outputs.new_version }}" \
            --generate-notes \
            --target master